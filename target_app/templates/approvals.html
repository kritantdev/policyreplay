{% extends "base.html" %}{% block body %}<h1>Approvals</h1>
{% for a in approvals %}<form class="approval" method="post" action="/approvals/{{ a.id }}/approve" data-testid="approval-{{ a.id }}">
<span>Order {{ a.order_id }}: {{ a.amount }} INR ({{ a.status }})</span>
<button data-testid="approve-{{ a.id }}" type="submit">Approve</button></form>{% else %}<p class="empty">No approval requests.</p>{% endfor %}{% endblock %}
