{% extends "base.html" %}{% block body %}
<div class="auth">
<h1>Sign in</h1>
{% if error %}<p data-testid="error">{{ error }}</p>{% endif %}
<form method="post" action="/login" class="stack">
<label for="username">Username</label>
<input id="username" data-testid="login-username" name="username" autocomplete="username" autofocus>
<button data-testid="login-submit" type="submit">Sign in</button></form>
</div>{% endblock %}
